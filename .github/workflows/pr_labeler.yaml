name: Label PRs
on:
  - pull_request_target

jobs:
  pr-labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write  # Add this permission to allow creating labels
    runs-on: ubuntu-latest
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-pr-labeler@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
